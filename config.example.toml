# claude-rc-daemon configuration.
# Each hot path is watched (non-recursively); every immediate sub-folder that is a git
# repository gets its own `claude remote-control` server in a tmux session named rc-<folder>.
# A hot path is never a project itself, so listing ~/Projects/ZuraSolutions here both
# tracks its children and stops ~/Projects from treating it as one.

# Default when omitted: ["~/Projects"]. Add a nested folder that only *holds* projects
# (e.g. "~/Projects/Work") to serve its children; a hot path is never served as a project itself.
hot_paths = ["~/Projects"]

# Sub-folders to ignore. A bare name matches in any hot path; a path matches exactly.
exclude = []

# Only folders containing .git are projects. Set false to also serve plain folders (same-dir mode).
require_git = true

# Extra flags appended to every `claude remote-control` invocation.
claude_args = ["--no-sandbox"]

# Max concurrent sessions per project server (`claude remote-control --capacity`).
capacity = 32

# Permission mode for sessions spawned from claude.ai/code (`--permission-mode`): acceptEdits, auto,
# bypassPermissions, default, dontAsk, plan. "" leaves each project's own settings in charge.
permission_mode = ""

# How project servers run sessions: "worktree" (each session gets its own git worktree; plain folders
# fall back to same-dir), "same-dir" (all sessions share the folder), "session" (one session only).
spawn_mode = "worktree"

# Every interactive `claude` session starts with Remote Control on. The daemon keeps
# remoteControlAtStartup = true in ~/.claude/settings.json. false forces it off; delete the line to
# leave the setting alone.
remote_all_sessions = true

# Also switch on Remote Control in claude sessions that are already open without it. Works for
# sessions inside tmux, typed as /remote-control only while the session is idle with an empty prompt.
convert_sessions = true

# The remote for this machine: one extra server for a whole folder, named after the machine (hostname
# unless machine_remote_name is set). A hot path is never served as a project on its own; this keeps
# one served. Not your home directory: Claude Code never saves trust for it. Unset: no machine remote.
# machine_remote = "~/Projects"
# machine_remote_name = ""

# Accept the Claude Code workspace-trust dialog automatically for every project folder found
# directly inside a hot path. Listing the hot path is the opt-in. Without this, new folders sit
# in "untrusted" until you run `claude-rc-daemon --trust`.
auto_trust = true

# session_prefix = "rc-"        # tmux session name prefix
# settle_seconds = 10           # wait after a folder event before reconciling (lets git clone finish)
# reconcile_interval = 60       # periodic full scan, catches anything inotify missed
# stagger_seconds = 3           # pause between consecutive server starts
# stop_grace_seconds = 10       # SIGINT, then SIGTERM after this long
# max_disconnected_seconds = 300
#   A server that loses its link to Claude retries forever without exiting, so its process
#   stays healthy while the device reads "offline" in claude.ai/code. After this many
#   seconds of an unbroken reconnect loop the daemon restarts it. 0 disables the check.
# max_backoff_seconds = 300     # longest wait before retrying a server that keeps crashing
# failing_after = 10            # crashes in a row before a folder is marked failing (logged, hourly retries)
# network_probe = "api.anthropic.com:443"
#   TCP-connected before starting servers (through HTTPS_PROXY when set). While it fails, and while
#   Claude Code is logged out, starts are held instead of piling up back-off; once both are back,
#   every server restarts. "" disables the network check.
# recovery_poll_seconds = 10    # how often to re-check login/network while starts are held
# max_log_bytes = 5000000       # a server log larger than this is rotated to .log.1 on the next start
# restart_on_config_change = true
#   Restart idle servers whose flags no longer match this file (capacity, permission_mode, claude_args).
#   Servers with sessions attached are restarted once they are idle.
# log_dir = "~/.local/state/claude-rc-daemon/logs"   # each server's terminal output, rc-<folder>.log
# settings_template = "~/.config/claude-rc-daemon/settings.local.json"
#   Copied to <project>/.claude/settings.local.json when that file does not exist (never overwritten)
#   and added to the project's .git/info/exclude. Set to "" to disable.
